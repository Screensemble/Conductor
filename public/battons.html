<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensemble — Hardware buttons</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
         background: var(--navy); color: var(--text); }
  :root {
    --navy: #0a1428; --card: #10203c; --edge: #1d3a63;
    --cyan: #4ecbe8; --text: #dce9f5; --dim: #7e95b3; --red: #e86a6a;
  }
  header { display: flex; align-items: center; gap: 14px;
           padding: 10px 18px; background: var(--card);
           border-bottom: 1px solid var(--edge); }
  .mark { height: 34px; }
  .wordmark { height: 18px; }
  nav { display: flex; gap: 4px; margin-left: 12px; }
  nav .tab { background: none; border: 0; border-radius: 6px 6px 0 0;
             color: var(--dim); font-size: 14px; font-weight: 600;
             padding: 10px 14px; cursor: pointer; text-decoration: none; }
  nav .tab:hover { color: var(--text); }
  nav .tab.on { color: var(--cyan); border-bottom: 2px solid var(--cyan); }
  .backlink { color: var(--dim); text-decoration: none; font-weight: 600; }
  .backlink:hover { color: var(--cyan); }
  main { padding: 18px; max-width: 1100px; margin: 0 auto; }
  h2 { margin: 22px 0 10px; font-size: 15px; color: var(--cyan);
       letter-spacing: .4px; }
  h2:first-child { margin-top: 0; }
  .card { background: var(--card); border: 1px solid var(--edge);
          border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase;
       letter-spacing: .6px; color: var(--dim); padding: 4px 8px;
       border-bottom: 1px solid var(--edge); }
  td { padding: 8px; border-bottom: 1px solid var(--edge); }
  .dim { color: var(--dim); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: #34507a; margin-right: 6px; }
  .dot.on { background: #5bd68a; }
  .chip { display: inline-block; background: var(--edge); border-radius: 10px;
          padding: 1px 8px; margin: 1px 3px 1px 0; font-size: 12px; }
  button { background: var(--edge); border: 0; color: var(--text);
           border-radius: 6px; padding: 6px 12px; cursor: pointer;
           font-size: 13px; }
  button:hover { background: #27507f; }
  button.primary { background: var(--cyan); color: var(--navy); font-weight: 700; }
  button.danger { background: none; color: var(--red); }
  button.mini { padding: 3px 8px; font-size: 12px; }
  button.secondary { background: none; border: 1px solid var(--edge); color: var(--dim); }
  button.secondary:hover { color: var(--text); border-color: var(--cyan); }
  input, select { background: #060e1e; border: 1px solid var(--edge);
                  color: var(--text); border-radius: 6px; padding: 6px 8px;
                  font-size: 13px; }
  label { display: block; margin: 8px 0 2px; font-size: 12px;
          color: var(--dim); }
  input[type=checkbox] { accent-color: var(--cyan); width: 15px; height: 15px;
                         padding: 0; vertical-align: middle; cursor: pointer; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  #bSelBar, #aSelBar { align-items: center; }
  tbody tr { cursor: pointer; }
  tr.sel td { background: #0c1930; }
  .row > div { min-width: 140px; }
  .picklist { max-height: 140px; overflow-y: auto; min-width: 170px;
              background: #060e1e; border: 1px solid var(--edge);
              border-radius: 6px; padding: 6px 10px; }
  .picklist label { display: flex; gap: 8px; align-items: center;
                    padding: 2px 0; font-size: 13px; color: var(--text);
                    margin: 0; }
  .dim a { color: var(--cyan); }
  .dayrow { display: flex; gap: 4px; margin-top: 4px; }
  .dayrow button { width: 30px; height: 30px; padding: 0; border-radius: 6px;
                   border: 1px solid var(--edge); background: #060e1e;
                   color: var(--dim); cursor: pointer; font-size: 12px; }
  .dayrow button.on { background: var(--cyan); color: var(--navy);
                      font-weight: 700; border-color: var(--cyan); }
  .mono { font-family: Consolas, monospace; font-size: 12px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--cyan); color: var(--navy); font-weight: 700;
           border-radius: 8px; padding: 9px 18px; opacity: 0;
           transition: opacity .25s; pointer-events: none; }
  .hookurl { background: #060e1e; border: 1px solid var(--edge);
             border-radius: 6px; padding: 4px 8px; }
</style><script src="/icons.js"></script>
</head><body>
<div id="topnav" data-page="automations"></div>
<main>
  <h2>Hardware buttons <small style="color:var(--dim);font-weight:400">(Battons)</small></h2>
  <div id="pending" class="card" style="display:none"></div>
  <div id="bSelBar" class="row" style="display:none;margin-bottom:8px">
    <span id="bSelCount" class="dim"></span>
    <button class="mini secondary" onclick="selBatRename()">Rename</button>
    <button class="mini danger" onclick="selBatDelete()">Delete</button>
    <button class="mini secondary" onclick="bSelClear()">Clear</button>
  </div>
  <div class="card"><table>
    <tr><th><input type="checkbox" title="select all"
      onchange="bSelAll(this.checked)"></th>
      <th>Name</th><th>Inputs</th><th>Version</th><th>IP</th>
        <th>Last seen</th></tr>
    <tbody id="brows"></tbody>
  </table></div>

  <h2>Automations — when this, then that</h2>
  <div id="aSelBar" class="row" style="display:none;margin-bottom:8px">
    <span id="aSelCount" class="dim"></span>
    <button class="mini secondary" onclick="selAutoEdit()">Edit</button>
    <button class="mini secondary" onclick="selAutoTest()">Test</button>
    <button class="mini secondary" onclick="selAutoHook()">Copy URL</button>
    <button class="mini" onclick="selAutoEnable(true)">Enable</button>
    <button class="mini" onclick="selAutoEnable(false)">Disable</button>
    <button class="mini danger" onclick="selAutoDelete()">Delete</button>
    <button class="mini secondary" onclick="aSelClear()">Clear</button>
  </div>
  <div class="card"><table>
    <tr><th><input type="checkbox" title="select all"
      onchange="aSelAll(this.checked)"></th>
      <th>Name</th><th>When</th><th>Then</th><th>Cooldown</th></tr>
    <tbody id="arows"></tbody>
  </table></div>

  <div class="card" id="editor">
    <b id="edTitle">New automation</b>
    <input type="hidden" id="edId">
    <div class="row">
      <div style="min-width:220px"><label>Name</label>
        <input id="edName" style="width:100%"></div>
      <div><label>When</label>
        <select id="edWhenType" onchange="whenTypeChanged()">
          <option value="batton">Batton input</option>
          <option value="webhook">Webhook</option>
          <option value="schedule">Schedule</option>
        </select></div>
      <div id="wBatton"><label>Batton input</label>
        <select id="edBattonInput"></select></div>
      <div id="wSched" style="display:none"><label>When</label>
        <div class="row">
          <input id="edSchedDate" type="date" title="one-shot date (empty = recurring)">
          <input id="edSchedTime" type="time" required>
        </div>
        <div class="dayrow" id="edSchedDays">
          <button type="button" data-d="6">S</button><button type="button" data-d="0">M</button><button type="button" data-d="1">T</button><button type="button" data-d="2">W</button><button type="button" data-d="3">T</button><button type="button" data-d="4">F</button><button type="button" data-d="5">S</button>
        </div>
        <div class="dim" style="font-size:11px">date set = runs once · days = weekly · neither = daily · <span id="schedTz">server local time</span></div></div>
      <div><label>Then</label>
        <select id="edAction" onchange="actionChanged()">
          <option value="sync">Play in sync</option>
          <option value="prepare">Prepare</option>
          <option value="perform">Perform (go)</option>
          <option value="play_item">Play item</option>
          <option value="pause">Pause / resume</option>
          <option value="next">Next item</option>
          <option value="prev">Previous item</option>
          <option value="stop">Stop</option>
          <option value="resume">Resume (from Kodi UI)</option>
          <option value="exit_ui">Exit to Kodi UI</option>
          <option value="restart">Restart playlist</option>
          <option value="reboot">Reboot display</option>
          <option value="playlist">Apply playlist</option>
        </select></div>
      <div id="wItem" style="display:none"><label>Item</label>
        <input id="edItem" placeholder="media name"></div>
      <div id="wPlaylist" style="display:none"><label>Playlist</label>
        <select id="edPlaylist"></select></div>
    </div>
    <div class="row">
      <div style="flex-basis:100%"><label>Displays</label>
        <div id="edPerformers" class="picklist" style="max-width:100%;max-height:110px"></div>
        <div class="dim" style="font-size:11px">empty = all online ·
          <a href="#" onclick="perfPickAll(true);return false">all</a> /
          <a href="#" onclick="perfPickAll(false);return false">none</a></div></div>
      <div><label>Cooldown (seconds)</label>
        <input id="edCooldown" type="number" step="0.1" min="0" value="30" style="width:90px"></div>
      <div><label>Re-fire</label>
        <select id="edRetrigger">
          <option value="ignore">ignore</option>
          <option value="queue">queue</option>
          <option value="restart">restart</option>
        </select></div>
      <div><label>Lead (seconds)</label>
        <input id="edLead" type="number" step="0.1" min="0" value="0.5" style="width:80px"></div>
    </div>
    <div id="wHook" class="mono" style="display:none;margin-top:8px"></div>
    <div style="margin-top:10px">
      <button class="primary" onclick="saveAutomation()">Save</button>
      <button onclick="resetEditor()">Clear</button>
    </div>
  </div>
</main>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json().catch(() => ({}));
}
function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s | 0}s ago`;
  if (s < 3600) return `${s / 60 | 0}m ago`;
  return `${s / 3600 | 0}h ago`;
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}

let battons = [], autos = {}, performers = [], collections = [], playlists = {};

async function refresh() {
  const [b, a, p, c, pl] = await Promise.all([
    api("/api/battons"), api("/api/automations"), api("/api/performers"),
    api("/api/collections"), api("/api/playlists"),
  ]);
  api("/api/health").then(h => {
    if (h?.tz) $("schedTz").textContent = `server time (${h.tz})`;
  });
  battons = b.battons || [];
  autos = a.automations || {};
  performers = p.performers || p.players || [];
  collections = c.collections || [];
  playlists = pl.playlists || {};
  renderPending(b.pending || []);
  renderBattons();
  renderAutos();
  fillInputs();
  fillPerformers();
  fillPlaylists();
}

// -- Battons ---------------------------------------------------------------

function renderPending(list) {
  const box = $("pending");
  box.style.display = list.length ? "" : "none";
  box.innerHTML = list.length
    ? "<b>Pending pair requests</b>" + list.map(o => `
      <div style="margin-top:8px">
        <b>${esc(o.name)}</b>
        <span class="dim mono">${esc(o.hardware_id)}</span>
        <span class="dim">· ${o.inputs.map(i => esc(i.id)).join(", ") || "no inputs"}</span>
        <button class="primary" onclick="approve('${esc(o.pair_id)}')">Authorize</button>
        <button class="danger" onclick="deny('${esc(o.pair_id)}')">Deny</button>
      </div>`).join("")
    : "";
}

async function approve(pid) {
  const name = prompt("Name this Batton (leave blank to keep offered name):", "");
  const r = await api(`/api/battons/pending/${encodeURIComponent(pid)}/approve`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(name ? { name } : {}),
  });
  toast(r.error || `authorized ${r.batton?.name || ""}`);
  refresh();
}
async function deny(pid) {
  await api(`/api/battons/pending/${encodeURIComponent(pid)}/deny`, { method: "POST" });
  refresh();
}

// Select-then-act — row checks drive the top-edge bars (mobile: no
// per-row button cram). Sets survive the refresh poll.
const bSelSet = new Set(), aSelSet = new Set();
function rowTap(ev, id, set) {
  if (ev.target.closest("input,button,a,select,textarea,label")) return;
  set.has(id) ? set.delete(id) : set.add(id);
  renderBattons(); renderAutos();
}
function selBar(set, bar, count) {
  $(bar).style.display = set.size ? "" : "none";
  $(count).textContent = set.size + " selected";
}
function bSel(on, id) { on ? bSelSet.add(id) : bSelSet.delete(id);
  selBar(bSelSet, "bSelBar", "bSelCount"); }
function bSelAll(on) {
  document.querySelectorAll("#brows .bsel").forEach(c => bSel(on, c.value));
}
function bSelClear() { bSelSet.clear(); renderBattons(); }
function aSel(on, id) { on ? aSelSet.add(id) : aSelSet.delete(id);
  selBar(aSelSet, "aSelBar", "aSelCount"); }
function aSelAll(on) {
  document.querySelectorAll("#arows .asel").forEach(c => aSel(on, c.value));
}
function aSelClear() { aSelSet.clear(); renderAutos(); }
function oneOf(set, what) {
  if (set.size !== 1) {
    toast(`select exactly one ${what} (${set.size} selected)`);
    return null;
  }
  return [...set][0];
}
function selBatRename() { const id = oneOf(bSelSet, "batton"); if (id) renameBatton(id); }
async function selBatDelete() {
  if (!bSelSet.size) return toast("select batton(s) first");
  if (!confirm(`Remove ${bSelSet.size} batton(s)? They will need to re-pair.`)) return;
  for (const id of bSelSet) {
    await api(`/api/battons/${encodeURIComponent(id)}`, { method: "DELETE" });
  }
  bSelSet.clear(); refresh();
}
function selAutoEdit() { const id = oneOf(aSelSet, "automation"); if (id) editAutomation(id); }
async function selAutoTest() {
  if (!aSelSet.size) return toast("select automation(s) first");
  for (const id of aSelSet) await testFire(id);
}
function selAutoHook() {
  const id = oneOf(aSelSet, "automation");
  if (!id) return;
  const a = autos[id];
  if (a?.when?.type !== "webhook") return toast("that automation is not a webhook");
  copyHook(a.when.key);
}
async function selAutoEnable(on) {
  if (!aSelSet.size) return toast("select automation(s) first");
  for (const id of aSelSet) {
    const a = autos[id];
    if (!a) continue;
    await api(`/api/automations/${encodeURIComponent(id)}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...a, enabled: on }),
    });
  }
  refresh();
}
async function selAutoDelete() {
  if (!aSelSet.size) return toast("select automation(s) first");
  if (!confirm(`Delete ${aSelSet.size} automation(s)?`)) return;
  for (const id of aSelSet) {
    await api(`/api/automations/${encodeURIComponent(id)}`, { method: "DELETE" });
  }
  aSelSet.clear(); refresh();
}

function renderBattons() {
  $("brows").innerHTML = battons.length ? battons.map(b => `
    <tr class="${bSelSet.has(b.id) ? "sel" : ""}"
        onclick="rowTap(event, '${esc(b.id)}', bSelSet)">
      <td><input type="checkbox" class="bsel" value="${esc(b.id)}"
        ${bSelSet.has(b.id) ? "checked" : ""}
        onchange="bSel(this.checked, '${esc(b.id)}')">
        <span class="dot ${b.online ? "on" : ""}"></span></td>
      <td>${esc(b.name)} <span class="dim mono">${esc(b.id)}</span></td>
      <td>${(b.inputs || []).map(i =>
        `<span class="chip" title="GPIO ${i.pin}, ${i.edge}">${esc(i.id)}</span>`).join("")}
        <span class="dim">${b.inputs?.length ? "" : "none configured"}</span></td>
      <td class="dim">${esc(b.version || "—")}</td>
      <td class="dim mono">${esc(b.ip || "—")}</td>
      <td class="dim">${ago(b.last_seen)}</td>
    </tr>`).join("")
  : `<tr><td colspan="6" class="dim">No Battons paired — open a Batton's
     web page, enter this server URL, and press Pair.</td></tr>`;
  selBar(bSelSet, "bSelBar", "bSelCount");
}

async function renameBatton(id) {
  const b = battons.find(x => x.id === id) || {};
  const name = prompt("Batton name:", b.name || "");
  if (!name) return;
  await api(`/api/battons/${encodeURIComponent(id)}/rename`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  refresh();
}


// -- Automations -----------------------------------------------------------

const DAYL = ["M", "T", "W", "T", "F", "S", "S"];
function whenText(a) {
  const w = a.when || {};
  if (w.type === "batton") {
    const b = battons.find(x => x.id === w.batton_id);
    return `${esc(b?.name || w.batton_id)} → ${esc(w.input)}`;
  }
  if (w.type === "webhook") return `webhook <span class="mono dim">${esc(w.key)}</span>`;
  if (w.type === "schedule") {
    const what = w.date ? `on ${esc(w.date)}`
      : (w.days && w.days.length)
        ? (w.days.map(d => DAYL[d]).join("") || "days?")
        : "daily";
    return `${what} at ${esc(w.time || "?")}`;
  }
  return esc(w.type || "?");
}
function thenText(a) {
  const t = a.then || {};
  const tgt = Array.isArray(t.performers) && t.performers.length
    ? `${t.performers.length} target${t.performers.length > 1 ? "s" : ""}` : "all displays";
  const label = t.action === "playlist" ? `playlist ${esc(t.item || "?")}` : esc(t.action);
  return `${label}${t.action !== "playlist" && t.item ? " " + esc(t.item) : ""} → ${tgt}`;
}

function renderAutos() {
  const rows = Object.entries(autos);
  $("arows").innerHTML = rows.length ? rows.map(([id, a]) => `
    <tr class="${aSelSet.has(id) ? "sel" : ""}"
        onclick="rowTap(event, '${esc(id)}', aSelSet)">
      <td><input type="checkbox" class="asel" value="${esc(id)}"
        ${aSelSet.has(id) ? "checked" : ""}
        onchange="aSel(this.checked, '${esc(id)}')"></td>
      <td>${esc(a.name)}${a.enabled === false
        ? ' <span class="chip">disabled</span>' : ""}</td>
      <td>${whenText(a)}</td>
      <td>${thenText(a)}</td>
      <td class="dim">${a.cooldown_ms ? (a.cooldown_ms / 1000) + "s" : "—"}</td>
    </tr>`).join("")
  : `<tr><td colspan="5" class="dim">No automations yet — build one below.</td></tr>`;
  selBar(aSelSet, "aSelBar", "aSelCount");
}

function copyHook(key) {
  const url = `${location.origin}/api/hooks/${key}`;
  navigator.clipboard?.writeText(url);
  toast("webhook URL copied — POST it to fire");
}

function fillInputs() {
  const sel = $("edBattonInput"), cur = sel.value;
  sel.innerHTML = battons.flatMap(b => (b.inputs || [])
    .map(i => `<option value="${esc(b.id)}|${esc(i.id)}">
      ${esc(b.name)} → ${esc(i.id)}</option>`)).join("")
    || `<option value="">(no batton inputs)</option>`;
  if (cur) sel.value = cur;
}
function fillPerformers() {
  // Preserve in-progress selections — the 5s refresh rebuilds this list
  // and must not uncheck what the user is editing.
  const was = new Set(
    [...document.querySelectorAll("#edPerformers input:checked")]
      .map(c => c.value));
  const cols = collections.map(c =>
    `<label><input type="checkbox" value="${esc(c.id)}">` +
    `&#9658; ${esc(c.name || c.id)}</label>`).join("");
  $("edPerformers").innerHTML =
    (cols ? `<div class="dim" style="font-size:11px">Collections</div>${cols}` : "") +
    `<div class="dim" style="font-size:11px">Displays</div>` +
    performers.map(p =>
      `<label><input type="checkbox" value="${esc(p.id)}">` +
      `${esc(p.name || p.id)}</label>`).join("")
    || '<span class="dim">none paired</span>';
  if (was.size) {
    document.querySelectorAll("#edPerformers input").forEach(c =>
      c.checked = was.has(c.value));
  }
}
function perfPickAll(on) {
  document.querySelectorAll("#edPerformers input").forEach(c => c.checked = on);
}
function perfGet() {
  return [...document.querySelectorAll("#edPerformers input:checked")]
    .map(c => c.value);
}
function perfSet(ids) {
  const on = new Set(ids || []);
  document.querySelectorAll("#edPerformers input").forEach(c =>
    c.checked = on.has(c.value));
}
function fillPlaylists() {
  const sel = $("edPlaylist"), cur = sel.value;
  sel.innerHTML = Object.keys(playlists).map(n =>
    `<option>${esc(n)}</option>`).join("")
    || '<option value="">(no playlists)</option>';
  if (cur) sel.value = cur;
}
// Schedule day buttons — S M T W T F S map to 6,0,1,2,3,4,5 (0=Mon).
document.querySelectorAll("#edSchedDays button").forEach(b =>
  b.addEventListener("click", () => b.classList.toggle("on")));
function schedDaysGet() {
  return [...document.querySelectorAll("#edSchedDays button.on")]
    .map(b => +b.dataset.d).sort();
}
function schedDaysSet(days) {
  const on = new Set(days || []);
  document.querySelectorAll("#edSchedDays button").forEach(b =>
    b.classList.toggle("on", on.has(+b.dataset.d)));
}

function whenTypeChanged() {
  const t = $("edWhenType").value;
  $("wBatton").style.display = t === "batton" ? "" : "none";
  $("wSched").style.display = t === "schedule" ? "" : "none";
  $("wHook").style.display = t === "webhook" ? "" : "none";
}
function actionChanged() {
  const a = $("edAction").value;
  $("wItem").style.display = a === "play_item" ? "" : "none";
  $("wPlaylist").style.display = a === "playlist" ? "" : "none";
}

function resetEditor() {
  $("edId").value = ""; $("edName").value = "";
  $("edTitle").textContent = "New automation";
  $("wHook").style.display = "none";
}

function editAutomation(id) {
  const a = autos[id]; if (!a) return;
  $("edId").value = id;
  $("edTitle").textContent = `Edit ${a.name}`;
  $("edName").value = a.name || "";
  $("edWhenType").value = a.when?.type || "batton";
  if (a.when?.type === "batton") {
    $("edBattonInput").value = `${a.when.batton_id}|${a.when.input}`;
  }
  if (a.when?.type === "schedule") {
    $("edSchedDate").value = a.when.date || "";
    $("edSchedTime").value = a.when.time || "";
    schedDaysSet(a.when.days || []);
  }
  $("edAction").value = a.then?.action || "sync";
  $("edItem").value = a.then?.item || "";
  if (a.then?.action === "playlist") $("edPlaylist").value = a.then.item || "";
  perfSet(a.then?.performers || []);
  $("edCooldown").value = (a.cooldown_ms ?? 30000) / 1000;
  $("edRetrigger").value = a.retrigger || "ignore";
  $("edLead").value = (a.lead_ms ?? 500) / 1000;
  if (a.when?.type === "webhook") {
    $("wHook").style.display = "";
    $("wHook").innerHTML =
      `fire URL: <span class="hookurl">POST ${esc(location.origin)}/api/hooks/${esc(a.when.key)}</span>`;
  }
  whenTypeChanged(); actionChanged();
  window.scrollTo(0, document.body.scrollHeight);
}

async function saveAutomation() {
  const wt = $("edWhenType").value;
  const when = wt === "webhook"
    ? { type: "webhook" }
    : wt === "schedule"
      ? (() => {
          const time = $("edSchedTime").value;
          if (!time) return null;
          const w = { type: "schedule", time };
          const date = $("edSchedDate").value;
          const days = schedDaysGet();
          if (date) w.date = date;
          else if (days.length) w.days = days;
          return w;
        })()
      : (() => {
          const [batton_id, input] = ($("edBattonInput").value || "|").split("|");
          if (!batton_id) return null;
          return { type: "batton", batton_id, input };
        })();
  if (!when) return toast(wt === "schedule" ? "pick a time first" : "pick a batton input first");
  const act = $("edAction").value;
  const then = {
    action: act,
    performers: perfGet(),
    ...(act === "playlist"
      ? ($("edPlaylist").value ? { item: $("edPlaylist").value } : {})
      : ($("edItem").value.trim() ? { item: $("edItem").value.trim() } : {})),
  };
  if (act === "playlist" && !then.item) return toast("pick a playlist first");
  const body = {
    name: $("edName").value.trim() || "automation",
    when, then,
    cooldown_ms: Math.round((+$("edCooldown").value || 0) * 1000),
    retrigger: $("edRetrigger").value,
    lead_ms: Math.round((+$("edLead").value || 0.5) * 1000),
  };
  const id = $("edId").value;
  const r = id
    ? await api(`/api/automations/${encodeURIComponent(id)}`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) })
    : await api(`/api/automations`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) });
  toast(r.error || "saved");
  resetEditor();
  refresh();
}

async function testFire(id) {
  const r = await api(`/api/automations/${encodeURIComponent(id)}/fire`,
    { method: "POST" });
  toast(r.accepted === false ? `not fired: ${r.reason}` : `fired → ${r.delivered ?? 0} display(s)`);
}


whenTypeChanged(); actionChanged();
refresh();
setInterval(refresh, 5000);
</script>
