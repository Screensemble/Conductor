<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensemble — Library</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: dark;
    --navy: #0a1428; --card: #10203c; --edge: #1d3a63;
    --cyan: #3ec1f3; --blue: #1e9be8; --text: #dde6f2; --dim: #7a9bb8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: var(--text);
         font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 10px 20px; background: linear-gradient(90deg,#0d1b33,#12294d);
           border-bottom: 2px solid var(--blue);
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header img.mark { height: 36px; }
  header img.wordmark { height: 24px; }
  nav { display: flex; gap: 4px; margin-left: 12px; }
  nav .tab { background: none; border: 0; border-radius: 6px 6px 0 0;
             color: var(--dim); font-size: 14px; font-weight: 600;
             padding: 10px 14px; cursor: pointer; }
  nav .tab:hover { color: var(--text); }
  nav .tab.on { color: var(--cyan); border-bottom: 2px solid var(--cyan); }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { margin: 26px 0 10px; font-size: 15px; color: var(--text); }
  section + section { margin-top: 32px; }
  h2 small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  h2:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px;
          background: var(--card); border: 1px solid var(--edge);
          border-radius: 8px; overflow: hidden; }
  td, th { padding: 8px 10px; text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); border-bottom: 1px solid var(--edge); font-weight: 600; }
  td { border-bottom: 1px solid var(--edge); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  .badge { color: var(--cyan); font-size: 10px; border: 1px solid var(--cyan);
           border-radius: 4px; padding: 1px 5px; margin-left: 6px;
           text-transform: uppercase; letter-spacing: .04em; }
  .badge.gray { color: var(--dim); border-color: var(--dim); }
  button { background: linear-gradient(180deg,#2fb2f0,#1e7fd0); color: #fff;
           border: 0; border-radius: 6px; padding: 8px 14px; font-size: 14px;
           cursor: pointer; }
  button.secondary { background: #24405f; }
  button.danger { background: #8c2f39; }
  button:active { filter: brightness(.85); }
  button.mini { padding: 3px 8px; font-size: 12px; }
  .framepick { display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap; padding: 6px 0; }
  .framepick input { background: #000; border: 1px solid var(--edge);
    color: var(--text); border-radius: 5px; padding: 4px 7px; font: inherit; }
  .frameprev { width: 100%; margin-top: 8px; }
  .frameprev img { max-width: 320px; border-radius: 6px;
    border: 1px solid var(--edge); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  label.inline { display: flex; gap: 6px; align-items: center; margin: 0; }
  input, select { background: #000; border: 1px solid var(--edge); color: var(--text);
                  border-radius: 6px; padding: 7px 9px; font-size: 14px; }
  input:focus, select:focus { outline: none; border-color: var(--cyan); }
  input[type=checkbox] { width: auto; }
  input.dur { width: 56px; padding: 3px 6px; font-size: 12px; }
  .muted { color: var(--dim); font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--edge);
           border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px;
           background: #000; border: 1px solid var(--edge); display: block; }
  .thumbicon { font-size: 10px; color: var(--dim); display: flex;
               align-items: center; justify-content: center; }
  .bar { height: 8px; background: #0a1428; border-radius: 4px;
         overflow: hidden; flex: 1; min-width: 120px; }
  .bar i { display: block; height: 100%; border-radius: 4px;
           background: linear-gradient(90deg,#1e9be8,#3ec1f3);
           transition: width .25s ease; }
  .empty { padding: 14px; color: var(--dim); font-size: 13px;
           background: var(--card); border: 1px solid var(--edge);
           border-radius: 8px; }
  .backlink { color: var(--dim); font-size: 13px; text-decoration: none; }
  .backlink:hover { color: var(--cyan); }
  .plwrap { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  @media (max-width: 640px) {
    .plwrap { grid-template-columns: 1fr; }
    #pushBtn { flex: 1; }
  }
  .pllist { background: var(--card); border: 1px solid var(--edge);
            border-radius: 8px; padding: 10px; }
  .pllist .pl { padding: 8px 10px; border-radius: 6px; cursor: pointer;
                font-size: 14px; }
  .pllist .pl:hover { background: #16294a; }
  .pllist .pl.on { background: #16294a; color: var(--cyan); }
  .plitem { display: flex; align-items: center; gap: 8px; padding: 6px 8px;
            border-bottom: 1px solid var(--edge); font-size: 14px;
            cursor: pointer; }
  .plitem.sel, tr.sel td { background: #0c1930; }
  tbody tr[data-name] { cursor: pointer; }
  .plitem:last-child { border-bottom: 0; }
  .plitem .t { flex: 1; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .plitem .k { color: var(--dim); font-size: 11px; }
  .dperf { font-size: 13px; padding: 4px 8px; border: 1px solid var(--edge);
             border-radius: 6px; display: inline-flex; gap: 6px;
             align-items: center; }
  .dperf .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5e78; }
  .dperf .dot.on { background: #4caf50; }
  .syncres { font-size: 12px; color: var(--dim); margin-top: 8px; }
</style>
<script src="/icons.js"></script>
</head>
<body>
<div id="topnav" data-page="library"></div>
<main>

  <!-- ============ Library ============ -->
  <section>
    <h2>Media library <small>files live on the conductor — push to any display</small></h2>
    <div class="panel row">
      <input type="file" id="upFiles" multiple>
      <button id="upBtn" onclick="uploadFiles()">Upload to library</button>
      <div class="bar" id="upBar" hidden><i id="upFill" style="width:0%"></i></div>
      <span class="muted" id="upStatus"></span>
    </div>
    <div class="panel row" style="justify-content:space-between">
      <div class="row">
        <b>Push selected →</b>
        <span id="pushTargets"></span>
        <button class="mini" id="pushBtn" onclick="pushSelected()">Push</button>
        <button class="mini secondary" onclick="selFrame()">Frame</button>
        <button class="mini danger" onclick="selDelLib()">Delete</button>
      </div>
      <label class="inline"><input type="checkbox" id="selAll"
        onchange="toggleSelAll(this.checked)"> all</label>
    </div>
    <div id="libList"></div>
  </section>

  <!-- ============ Playlists ============ -->
  <section>
    <h2>Shared playlists <small>ordered groups synced to displays</small></h2>
    <div class="plwrap">
      <div class="pllist" id="plList">
        <div class="pl" onclick="newPlaylist()" style="color:var(--cyan)">+ New playlist</div>
      </div>
      <div class="panel" id="plEditor" hidden>
        <div class="row" style="margin-bottom:12px">
          <label style="margin:0">Name
            <input id="plName" style="width:200px"></label>
          <button class="mini danger" style="margin-left:auto"
            onclick="deletePlaylist()">Delete</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          <select id="plAdd"></select>
          <button class="mini secondary" onclick="addToPlaylist()">Add item</button>
        </div>
        <div id="plItems" class="panel" style="padding:6px;margin-bottom:12px"></div>
        <div class="row" id="plPlayers" style="margin-bottom:12px"></div>
        <div class="row">
          <button onclick="savePlaylist()">Save &amp; sync</button>
          <button class="secondary" onclick="syncPlaylist()">Sync now</button>
          <label class="inline"><input type="checkbox" id="plPrune">
            remove items not in playlist</label>
        </div>
        <div class="syncres" id="syncRes"></div>
      </div>
      <div class="empty" id="plHint">Select a playlist (or create one) to edit
        its items and assign displays.</div>
    </div>
  </section>

</main>
<script src="/upload-toast.js"></script>
<script>
const $ = id => document.getElementById(id);
const escH = s => String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// JS string argument inside a double-quoted inline handler: JSON-quote,
// then HTML-escape (the browser decodes the attribute before parsing JS).
const jsArg = s => escH(JSON.stringify(String(s ?? '')));
let libItems = [], players = [], playlists = {}, selPl = null;
let plItems = [], plPids = new Set();

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  return r.json();
}
const J = {method:'POST', headers:{'Content-Type':'application/json'}};

function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);' +
    'background:linear-gradient(180deg,#2fb2f0,#1e7fd0);padding:8px 18px;' +
    'border-radius:6px;z-index:10';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ---------- library ----------
function thumbHtml(i) {
  if (i.kind === 'image')
    return `<img class="thumb" src="/api/library/file/${encodeURIComponent(i.name)}" alt="">`;
  return '<div class="thumb thumbicon">video</div>';
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

async function refresh() {
  const [l, p, pl] = await Promise.all([
    api('/library'), api('/performers'), api('/playlists'),
  ]);
  libItems = l.items || [];
  players = (p.performers ?? p.players ?? []).filter(x => x.online);
  playlists = pl.playlists || {};
  renderLib(); renderTargets(); renderPlList(); renderPlEditor();
}

function renderLib() {
  if (!libItems.length) {
    $('libList').innerHTML =
      '<div class="empty">library is empty — upload media above</div>';
    return;
  }
  // Preserve in-progress selections — the refresh poll rebuilds this
  // list and must not uncheck what the user is selecting.
  const libSel = new Set(
    [...document.querySelectorAll('.libsel:checked')].map(c => c.value));
  $('libList').innerHTML = '<table class="rstack"><thead><tr><th></th><th></th>' +
    '<th>Name</th><th>Kind</th><th class="num">Size</th><th class="num">Sec</th>' +
    '</tr></thead><tbody>' +
    libItems.map(i =>
      `<tr data-name="${escH(i.name)}"` +
      `${libSel.has(i.name) ? ' class="sel"' : ''} onclick="rowTap(event, ${jsArg(i.name)})"><td>` +
      `<input type="checkbox" class="libsel" value="${escH(i.name)}"` +
      `${libSel.has(i.name) ? ' checked' : ''}></td>` +
      `<td>${thumbHtml(i)}</td><td class="cell-name"><b>${escH(i.name)}</b></td>` +
      `<td class="muted" data-l="Kind">${escH(i.kind)}</td>` +
      `<td class="num" data-l="Size">${fmtSize(i.size)}</td>` +
      `<td class="num" data-l="Sec">` +
      (i.kind === 'image'
        ? `<input class="dur" type="number" min="1" ` +
          `value="${i.duration ?? ''}" placeholder="10" ` +
          `title="default seconds on every display — re-applied on push ` +
          `and playlist sync (empty = 10)" ` +
          `onchange="setLibDuration(${jsArg(i.name)}, this.value, this)">`
        : '—') +
      `</td></tr>`
    ).join('') + '</tbody></table>';
  // Re-anchor the open frame picker — the poll rebuild would otherwise
  // destroy it mid-use.
  if (openFrameTr) {
    const anchor = document.querySelector(
      `#libList tr[data-name="${CSS.escape(openFrameTr.dataset.for)}"]`);
    if (anchor) anchor.after(openFrameTr);
    else openFrameTr = null;
  }
}

// Frozen-frame picker: expand a row under the video with a timestamp
// field + live preview; Save stores it as a library image that pushes
// like any other asset. The detached node survives the 15s poll.
let openFrameTr = null;
function frameRow(name) {
  if (openFrameTr && openFrameTr.dataset.for === name) {
    openFrameTr.remove(); openFrameTr = null;
    return;
  }
  openFrameTr?.remove();
  const anchor = document.querySelector(
    `#libList tr[data-name="${CSS.escape(name)}"]`);
  if (!anchor) return;
  const row = document.createElement('tr');
  row.className = 'framerow';
  row.dataset.for = name;
  row.innerHTML = `<td colspan="6">
    <div class="framepick">
      <label>t = <input type="number" class="framet" min="0" step="0.5"
        value="0" style="width:80px"> s</label>
      <button class="mini" onclick="framePreview(this, ${jsArg(name)})">preview</button>
      <button class="mini" onclick="frameSave(this, ${jsArg(name)})">save frame</button>
      <span class="muted">becomes a still image in the library</span>
      <div class="frameprev"></div>
    </div></td>`;
  anchor.after(row);
  openFrameTr = row;
}

async function framePreview(btn, name) {
  const t = btn.closest('.framepick').querySelector('.framet').value;
  const prev = btn.closest('.framepick').querySelector('.frameprev');
  prev.innerHTML = '<span class="muted">extracting…</span>';
  const img = new Image();
  img.onload = () => { prev.innerHTML = ''; prev.appendChild(img); };
  img.onerror = () =>
    prev.innerHTML = '<span class="muted">no frame at that time</span>';
  img.src = `/api/library/${encodeURIComponent(name)}/frame?t=${encodeURIComponent(t)}`;
}

async function frameSave(btn, name) {
  const t = btn.closest('.framepick').querySelector('.framet').value;
  const d = await api(`/api/library/${encodeURIComponent(name)}/frame`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ t: Number(t) || 0 }),
  });
  toast(d.ok ? `saved ${d.name}` : `frame failed: ${d.error}`);
  refresh();
}

function renderTargets() {
  // Preserve checked push targets across the refresh poll.
  const was = new Set(
    [...document.querySelectorAll('.pushtarget:checked')].map(c => c.value));
  $('pushTargets').innerHTML = players.length
    ? players.map(p =>
        `<label class="inline dperf"><span class="dot${p.online ? ' on' : ''}"></span>` +
        `<input type="checkbox" class="pushtarget" value="${escH(p.id)}"` +
        `${was.has(p.id) ? ' checked' : ''}>` +
        `${escH(p.name || p.id)}</label>`).join('')
    : '<span class="muted">no displays online</span>';
}

function toggleSelAll(on) {
  document.querySelectorAll('.libsel').forEach(c => c.checked = on);
}

// Tap anywhere on a row toggles it (except its own inputs/links) —
// selection drives the top-edge action bar, not per-row buttons.
function rowTap(ev, name) {
  if (ev.target.closest('input,button,a,select,textarea,label')) return;
  const cb = ev.currentTarget.querySelector('.libsel');
  if (!cb) return;
  cb.checked = !cb.checked;
}

function fmtBytes(b) {
  return b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB'
                      : Math.max(1, Math.round(b / 1024)) + ' KB';
}

// XHR per file — upload.onprogress gives live bytes, which fetch cannot.
function uploadFile(f) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/library?name=' + encodeURIComponent(f.name));
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      $('upFill').style.width = pct + '%';
      $('upStatus').textContent =
        `${f.name}: ${pct}% (${fmtBytes(e.loaded)} of ${fmtBytes(e.total)})`;
    };
    xhr.onload = () =>
      xhr.status < 300 ? resolve() : reject(new Error('upload failed'));
    xhr.onerror = () => reject(new Error('upload failed'));
    xhr.send(f);
  });
}

async function uploadFiles() {
  const files = [...$('upFiles').files];
  if (!files.length) return;
  $('upBar').hidden = false;
  $('upBtn').disabled = true;
  try {
    for (let i = 0; i < files.length; i++) {
      $('upStatus').textContent =
        `uploading ${files[i].name} (${i + 1}/${files.length})…`;
      $('upFill').style.width = '0%';
      await uploadFile(files[i]);
    }
    $('upFill').style.width = '100%';
    $('upStatus').textContent = `${files.length} file(s) added`;
    $('upFiles').value = '';
    refresh();
  } catch (e) {
    $('upStatus').textContent = e.message;
  } finally {
    $('upBtn').disabled = false;
    setTimeout(() => { $('upBar').hidden = true; }, 6000);
  }
}

async function pushSelected() {
  const names = [...document.querySelectorAll('.libsel:checked')]
    .map(c => c.value);
  const pids = [...document.querySelectorAll('.pushtarget:checked')]
    .map(c => c.value);
  if (!names.length || !pids.length)
    return toast('select items and displays');
  for (const n of names)
    await api('/library/' + encodeURIComponent(n) + '/push',
      {...J, body: JSON.stringify({players: pids})});
  toast(`pushing ${names.length} item(s) to ${pids.length} display(s)`);
}

async function delLib(name) {
  if (!confirm('Delete "' + name + '" from the library? ' +
      'Displays keep their copies.')) return;
  await fetch('/api/library/' + encodeURIComponent(name), {method: 'DELETE'});
  refresh();
}

// Select-then-act helpers — row checks drive the top-edge buttons.
function libSelOne() {
  const sel = [...document.querySelectorAll('.libsel:checked')]
    .map(c => c.value);
  if (sel.length !== 1) {
    toast(`select exactly one item (${sel.length} selected)`);
    return null;
  }
  return sel[0];
}
function selFrame() {
  const n = libSelOne();
  if (!n) return;
  const it = libItems.find(x => x.name === n);
  if (it?.kind !== 'video') return toast('frames come from videos');
  frameRow(n);
}
async function selDelLib() {
  const sel = [...document.querySelectorAll('.libsel:checked')]
    .map(c => c.value);
  if (!sel.length) return toast('select item(s) first');
  if (!confirm(`Delete ${sel.length} item(s) from the library? ` +
      'Displays keep their copies.')) return;
  for (const n of sel) {
    await fetch('/api/library/' + encodeURIComponent(n), {method: 'DELETE'});
  }
  refresh();
}

// Per-asset default duration — travels with pushes and playlist syncs,
// and writes through to online displays immediately.
async function setLibDuration(name, val, input) {
  const secs = val === '' ? null : Math.max(1, Math.round(+val || 0));
  const r = await fetch('/api/library/' + encodeURIComponent(name), {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({duration: secs}),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || 'Could not save'); return; }
  toast(secs ? `Saved — ${secs}s on this item everywhere`
             : 'Default cleared on displays');
}

// ---------- playlists ----------
function renderPlList() {
  const names = Object.keys(playlists).sort();
  $('plList').innerHTML =
    '<div class="pl" onclick="newPlaylist()" style="color:var(--cyan)">+ New playlist</div>' +
    names.map(n =>
      `<div class="pl${selPl === n ? ' on' : ''}" ` +
      `onclick="selectPlaylist(${jsArg(n)})">${escH(n)}` +
      `<span class="muted" style="float:right">${playlists[n].items.length}</span></div>`
    ).join('');
}

function selectPlaylist(name) {
  selPl = name;
  const pl = playlists[name];
  plItems = [...pl.items];
  plPids = new Set(pl.players);
  renderPlList(); renderPlEditor();
  $('plName').value = selPl;   // set once — the poll must not clobber edits
}
function newPlaylist() {
  selPl = 'new playlist';
  plItems = []; plPids = new Set();
  renderPlList(); renderPlEditor();
  $('plName').value = selPl;
}

function plPidToggle(box) {
  // Keep plPids in sync live — the refresh poll rebuilds the checkbox
  // list, so unsaved selections must live in the model, not the DOM.
  if (box.checked) plPids.add(box.value); else plPids.delete(box.value);
}

function renderPlEditor() {
  $('plEditor').hidden = !selPl;
  $('plHint').hidden = !!selPl;
  if (!selPl) return;
  // Preserve item-check selections across the refresh rebuild.
  const plSel = new Set(
    [...document.querySelectorAll('.plsel:checked')].map(c => c.value));
  const addSel = $('plAdd').value;
  $('plAdd').innerHTML = libItems.map(i =>
    `<option value="${escH(i.name)}">${escH(i.name)}</option>`).join('');
  if (addSel) $('plAdd').value = addSel;
  $('plItems').innerHTML =
    (plItems.length ? `<div class="row" style="margin-bottom:6px">` +
      `<button class="mini secondary" onclick="plSelMove(-1)">↑ Up</button>` +
      `<button class="mini secondary" onclick="plSelMove(1)">↓ Down</button>` +
      `<button class="mini danger" onclick="plSelDel()">Remove</button>` +
      `</div>` : '') +
    (plItems.length
      ? plItems.map((n, i) => {
          const it = libItems.find(x => x.name === n);
          return `<div class="plitem${plSel.has(n) ? ' sel' : ''}"` +
            ` onclick="plRowTap(event, ${jsArg(n)})">` +
            `<input type="checkbox" class="plsel" value="${escH(n)}"` +
            `${plSel.has(n) ? ' checked' : ''}>` +
            `<span class="k">${i + 1}</span>` +
            `<span class="t">${escH(n)}</span>` +
            `<span class="k">${escH(it ? it.kind : 'missing')}</span></div>`;
        }).join('')
      : '<div class="muted" style="padding:6px">no items — add from the library</div>');
  $('plPlayers').innerHTML = '<b>Displays:</b>' + (
    players.length
      ? players.map(p =>
          `<label class="inline dperf"><span class="dot${p.online ? ' on' : ''}"></span>` +
          `<input type="checkbox" class="plpid" value="${escH(p.id)}" ` +
          `${plPids.has(p.id) ? 'checked' : ''} ` +
          `onchange="plPidToggle(this)">${escH(p.name || p.id)}</label>`
        ).join('')
      : '<span class="muted">none online</span>');
  $('syncRes').textContent = '';
}

function addToPlaylist() {
  const n = $('plAdd').value;
  if (n && !plItems.includes(n)) plItems.push(n);
  renderPlEditor();
}
function plMove(i, d) {
  const j = i + d;
  if (j < 0 || j >= plItems.length) return;
  [plItems[i], plItems[j]] = [plItems[j], plItems[i]];
  renderPlEditor();
}
function plDel(i) { plItems.splice(i, 1); renderPlEditor(); }

// Playlist items use checkboxes + a top bar like the other lists —
// selection is name-keyed so it stays sane across reorders.
function plRowTap(ev, name) {
  if (ev.target.closest('input,button,a,select,textarea,label')) return;
  const cb = ev.currentTarget.querySelector('.plsel');
  if (!cb) return;
  cb.checked = !cb.checked;
  ev.currentTarget.classList.toggle('sel', cb.checked);
}
function plSelNames() {
  return [...document.querySelectorAll('.plsel:checked')].map(c => c.value);
}
function plSelMove(d) {
  const sel = plSelNames();
  if (sel.length !== 1)
    return toast(`select exactly one item (${sel.length} selected)`);
  plMove(plItems.indexOf(sel[0]), d);
}
function plSelDel() {
  const sel = new Set(plSelNames());
  if (!sel.size) return toast('select item(s) first');
  plItems = plItems.filter(n => !sel.has(n));
  renderPlEditor();
}

function collectPl() {
  return {
    items: plItems,
    players: [...document.querySelectorAll('.plpid:checked')]
      .map(c => c.value),
  };
}

function showSync(results) {
  $('syncRes').innerHTML = Object.entries(results).map(([pid, r]) => {
    if (!r || !r.ok) return `${escH(pid)}: ${escH(r?.error || 'failed')}`;
    const bits = [];
    if (r.pushed.length) bits.push(`pushed ${r.pushed.length}`);
    if (r.pruned.length) bits.push(`removed ${r.pruned.length}`);
    if (r.missing.length) bits.push(`missing ${escH(r.missing.join(', '))}`);
    return `${escH(pid)}: ${bits.join(' · ') || 'in sync'}`;
  }).join('<br>');
}

async function savePlaylist() {
  const name = $('plName').value.trim();
  if (!name) return toast('name required');
  const r = await api('/playlists/' + encodeURIComponent(name),
    {...J, body: JSON.stringify(collectPl())});
  selPl = name;
  showSync(r.sync || {});
  refresh();
}
async function syncPlaylist() {
  if (!selPl || !playlists[selPl]) return toast('save first');
  const r = await api('/playlists/' + encodeURIComponent(selPl) + '/sync',
    {...J, body: JSON.stringify({prune: $('plPrune').checked})});
  showSync(r);
}
async function deletePlaylist() {
  if (!selPl || !playlists[selPl] ||
      !confirm('Delete playlist "' + selPl + '"? Displays keep content.'))
    return;
  await fetch('/api/playlists/' + encodeURIComponent(selPl),
    {method: 'DELETE'});
  selPl = null;
  refresh();
}

refresh();
setInterval(refresh, 15000);
</script>
<script src="/nav.js" defer></script>
<script src="/auth-chip.js"></script>
</body>
